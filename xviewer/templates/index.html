<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="tc">
<title>XViewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='black'/><path d='M6 5l12 14M18 5L6 19' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#fff;--ink:#0f1419;--muted:#536471;--line:#eff3f4;--hover:rgba(15,20,25,.03);
  --input:#eff3f4;--glass:rgba(255,255,255,.85);--card:#f7f9f9;--banner:#cfd9de;--blue:#1d9bf0;
  --pink:#f91880;--green:#00ba7c;--menu-shadow:0 0 15px rgba(101,119,134,.2),0 0 3px 1px rgba(101,119,134,.15);--btn:#0f1419;--btn-ink:#fff;
}
[data-theme=dark]{
  --bg:#000;--ink:#e7e9ea;--muted:#71767b;--line:#2f3336;--hover:rgba(231,233,234,.03);
  --input:#202327;--glass:rgba(0,0,0,.72);--card:#16181c;--banner:#333639;
  --menu-shadow:0 0 15px rgba(255,255,255,.2),0 0 3px 1px rgba(255,255,255,.15);--btn:#eff3f4;--btn-ink:#0f1419;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
svg{display:block}

/* ---------- shell ---------- */
.app{display:flex;justify-content:center;min-height:100vh}
.side{flex:none;width:275px;height:100vh;position:sticky;top:0;padding:4px 12px;display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:20px;width:fit-content;padding:12px;border-radius:9999px;border:0;background:none;font-size:20px;transition:background .2s}
.nav-i:hover{background:var(--hover);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.nav-i svg{width:26px;height:26px}
.nav-i.logo{padding:12px;margin:2px 0}
.nav-i.on{font-weight:700}
.center{width:100%;max-width:600px;border-inline:1px solid var(--line);min-height:100vh}
.right{flex:none;width:350px;padding:16px 0 0 28px;position:sticky;top:0;height:100vh}
.card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.card h2{font-size:20px;line-height:24px;font-weight:800;padding:12px 16px}
.card .row{display:block;padding:12px 16px;width:100%;text-align:left;border:0;background:none;transition:background .2s}
.card .row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.card .row small{display:block;color:var(--muted);font-size:13px}
.card .row b{font-size:15px}
.card p{padding:0 16px 14px;color:var(--muted);font-size:13px}
.bnav{display:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.sbox{display:flex;align-items:center;gap:12px;margin:8px 16px;padding:0 16px;height:42px;border-radius:9999px;background:var(--input);border:1px solid transparent;transition:border-color .2s,background .2s}
.sbox svg{width:19px;height:19px;color:var(--muted);flex:none}
.sbox:focus-within{background:var(--bg);border-color:var(--blue)}
.sbox:focus-within svg{color:var(--blue)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;font-size:15px}
.sbox input::placeholder{color:var(--muted)}
.sbox .clr{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:var(--blue);color:#fff;flex:none}
.sbox .clr svg{width:12px;height:12px;color:#fff}
.sbox .clr[hidden]{display:none}
.tabs{display:flex}
.tab{flex:1;position:relative;padding:14px 0;border:0;background:none;color:var(--muted);font-weight:500;transition:background .2s}
.tab:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:4px;border-radius:9999px;background:var(--blue)}

/* ---------- profile ---------- */
.ban{height:clamp(110px,28vw,200px);background:var(--banner)}
.pmain{padding:12px 16px 12px}
.prow{display:flex;justify-content:space-between;align-items:flex-start}
.pav{width:clamp(72px,24vw,133px);aspect-ratio:1;margin-top:calc(clamp(72px,24vw,133px)/-2 - 12px);border-radius:50%;border:4px solid var(--bg);background:var(--bg);overflow:hidden}
.pav img,.pav div{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-size:40px;font-weight:700;background:var(--input);color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:9999px;border:1px solid var(--line);font-weight:700;transition:background .2s}
.pill:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.pn{font-size:20px;line-height:24px;font-weight:800;display:flex;align-items:center;gap:4px;margin-top:8px;word-break:break-word}
.ph{color:var(--muted)}
.bio{margin-top:12px;white-space:pre-wrap;word-break:break-word}
.bio a,.body a{color:var(--blue)}
.bio a:hover,.body a:hover{text-decoration:underline}
.pst{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;color:var(--muted)}
.pst b{color:var(--ink);font-weight:700}
.tick{width:18px;height:18px;flex:none}

/* ---------- posts ---------- */
.tw{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);transition:background .2s;animation:fade .35s ease both}
.tw:hover{background:var(--hover)}
.av{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--input)}
.av img,.av div{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.tb{min-width:0;flex:1}
.rtl{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;font-weight:700;padding:8px 16px 0 68px;margin-bottom:-6px}
.rtl svg{width:16px;height:16px}
.th{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:2px;min-width:0}
.nm:hover{text-decoration:underline}
.nm .tick{width:17px;height:17px}
.hd,.th time{color:var(--muted)}
.hd{overflow:hidden;text-overflow:ellipsis}
.body{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.media{display:grid;gap:2px;margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.media.n2,.media.n3,.media.n4{grid-template-columns:1fr 1fr;aspect-ratio:16/9}
.media.n3 .m:first-child{grid-row:span 2}
.media.n4{grid-template-rows:1fr 1fr}
.m{position:relative;background:var(--input);min-height:80px;overflow:hidden}
.m img,.m video{width:100%;height:100%;display:block;object-fit:cover}
.media.n1 .m img,.media.n1 .m video{max-height:510px;height:auto;object-fit:contain;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.play span{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#fff;border:2px solid #fff}
.play svg{width:24px;height:24px;margin-left:3px}
.acts{display:flex;justify-content:space-between;max-width:425px;margin:4px 0 -4px -8px}
.act{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:13px;border:0;background:none;padding:0;position:relative;min-width:40px}
.act i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;transition:background .2s,color .2s}
.act svg{width:18px;height:18px}
.act.rp:hover{color:var(--green)}.act.rp:hover i{background:rgba(0,186,124,.12)}
.act.lk:hover{color:var(--pink)}.act.lk:hover i{background:rgba(249,24,128,.12)}
.act.cm:hover,.act.dl:hover,.act.ex:hover{color:var(--blue)}
.act.cm:hover i,.act.dl:hover i,.act.ex:hover i{background:rgba(29,155,240,.12)}
.dlw{position:relative;display:inline-flex}
.menu{position:absolute;right:-6px;bottom:calc(100% - 2px);min-width:230px;background:var(--bg);border-radius:12px;box-shadow:var(--menu-shadow);padding:6px 0;z-index:15;animation:pop .15s ease both;transform-origin:bottom right}
.menu>*{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;font-weight:700;color:var(--ink)}
.menu>*:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.menu svg{width:18px;height:18px;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);padding:0;margin:4px 0;height:0}

/* ---------- states ---------- */
.hero{padding:48px 24px;text-align:center}
.hero h1{font-size:31px;line-height:36px;font-weight:800;margin-bottom:8px}
.hero p{color:var(--muted);max-width:36ch;margin:0 auto}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.chip{border:1px solid var(--line);background:none;border-radius:9999px;padding:8px 16px;font-weight:700;transition:background .2s}
.chip:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.empty{padding:40px 32px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:31px;line-height:36px;font-weight:800;margin-bottom:6px}
.err{padding:32px;text-align:center}
.err b{display:block;font-size:20px;margin-bottom:6px}
.err p{color:var(--muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9999px;height:36px;padding:0 20px;background:var(--btn);color:var(--btn-ink);font-weight:700;transition:opacity .2s}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.err .row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn:hover{opacity:.85}
.sk{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.sk>i{flex:none;width:40px;height:40px;border-radius:50%}
.sk div{flex:1;display:grid;gap:10px;align-content:start}
.sk u{display:block;height:12px;border-radius:6px;width:100%}
.sk u:first-child{width:40%}.sk u:last-child{width:70%}
.sk i,.sk u{background:linear-gradient(90deg,var(--input) 25%,color-mix(in srgb,var(--ink) 9%,var(--input)) 50%,var(--input) 75%);background-size:200% 100%;animation:shine 1.3s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--blue);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- responsive ---------- */
@media (max-width:1264px){.right{display:none}}
@media (max-width:1000px){
  .side{width:80px;align-items:center}
  .nav-i span{display:none}
}
@media (max-width:700px){
  .side{display:none}
  .center{border-inline:0;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;inset:auto 0 0 0;z-index:20;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;height:52px;display:grid;place-items:center;border:0;background:none}
  .bnav svg{width:26px;height:26px}
  .bnav .on{color:var(--blue)}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  .menu{right:auto;left:-60px}
}
</style>
</head>
<body>
<div class="app">

  <nav class="side" aria-label="Main">
    <a class="nav-i logo" href="#/" aria-label="XViewer home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 4l14 16M19 4L5 20"/></svg></a>
    <a class="nav-i on" href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.7L1.3 10.4l1.3 1.6L4 10.9V21h6.5v-6h3v6H20V10.9l1.4 1.1 1.3-1.6z"/></svg><span>Home</span></a>
    <button class="nav-i" data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></button>
    <button class="nav-i" data-nav="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span>Theme</span></button>
  </nav>

  <div class="center">
    <header class="top">
      <form class="sbox" id="form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search a username" enterkeyhint="search" autocapitalize="off" spellcheck="false" aria-label="Search">
        <button class="clr" id="clr" type="button" aria-label="Clear" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </form>
      <div class="tabs" role="tablist" id="modes">
        <button class="tab" role="tab" aria-selected="true" data-mode="profile">Users</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="hashtag">Hashtags</button>
      </div>
    </header>
    <div id="out"></div>
  </div>

  <aside class="right">
    <div class="card">
      <h2>Try searching</h2>
      <button class="row" data-go="#/u/NASA"><b>@NASA</b><small>Open a profile</small></button>
      <button class="row" data-go="#/tag/photography"><b>#photography</b><small>Browse a hashtag</small></button>
      <p>Paste a post link into the search box to save its video or photos.</p>
    </div>
  </aside>
</div>

<nav class="bnav" aria-label="Main">
  <button data-nav="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.7L1.3 10.4l1.3 1.6L4 10.9V21h6.5v-6h3v6H20V10.9l1.4 1.1 1.3-1.6z"/></svg></button>
  <button data-nav="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button data-nav="theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const out = $('#out'), form = $('#form'), q = $('#q'), clr = $('#clr');
let mode = 'profile';

/* ---------- icons ---------- */
const S = (p, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const I = {
  reply: S('<path d="M21 11.5a8.4 8.4 0 01-12 7.6L3 20.5l1.6-5.2A8.5 8.5 0 1121 11.5z"/>'),
  repost: S('<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>'),
  heart: S('<path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.5 5c2 0 3.6 1.1 5.5 3 1.9-1.9 3.5-3 5.5-3C21 5 22.8 8.6 21.5 11.8 19.5 16.4 12 21 12 21z"/>'),
  dl: S('<path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/>'),
  ext: S('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>'),
  txt: S('<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>'),
  link: S('<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'),
  film: S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/>'),
  img: S('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/>'),
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>',
  tick: '<svg class="tick" viewBox="0 0 24 24" aria-label="Verified account"><path fill="#1d9bf0" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3 1 3-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3L2.6 15.8l1-3-1-3 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.7 2.7L16 9.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '' : n ? Intl.NumberFormat('en', {notation:'compact', maximumFractionDigits:1}).format(n) : '';
const fmtFull = n => n == null ? '–' : Intl.NumberFormat('en', {notation:'compact', maximumFractionDigits:1}).format(n);
const initial = s => esc((s || '?').trim().charAt(0).toUpperCase());

function ago(str){
  const d = new Date(str); if (isNaN(d)) return '';
  const s = (Date.now() - d) / 1000;
  if (s < 60) return Math.max(1, Math.floor(s)) + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return d.toLocaleDateString('en', {month:'short', day:'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
}
function linkify(text){
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 30)}${u.length > 36 ? '…' : ''}</a>`)
    .replace(/(^|[\s(])#([\p{L}\p{N}_]+)/gu, '$1<a href="#/tag/$2">#$2</a>')
    .replace(/(^|[\s(])@(\w{1,15})/g, '$1<a href="#/u/$2">@$2</a>');
}
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }

/* ---------- downloads ---------- */
function dlHref(m, name){
  if (m.download.startsWith('tweet:')) {
    const rest = m.download.slice(6), i = rest.lastIndexOf(':');
    return `/download?tweet=${encodeURIComponent(rest.slice(0, i))}&i=${rest.slice(i + 1)}&name=${name}.mp4`;
  }
  return `/download?url=${encodeURIComponent(m.download)}&name=${name}.${m.type === 'video' ? 'mp4' : 'jpg'}`;
}
const store = {};
function menuHtml(p){
  const dls = p.media.filter(m => m.download);
  const items = dls.map((m, i) => {
    const label = `Download ${m.type === 'video' ? 'video' : 'photo'}${dls.length > 1 ? ' ' + (i + 1) : ''}`;
    return `<a role="menuitem" data-dl href="${dlHref(m, `${esc(p.user.screen_name)}_${p.id}_${i + 1}`)}">${m.type === 'video' ? I.film : I.img}${label}</a>`;
  }).join('');
  return `<div class="menu" role="menu">${items}${items ? '<hr>' : ''}
    <button role="menuitem" data-savetext="${esc(p.id)}">${I.txt}Save post as text</button>
    <button role="menuitem" data-copy="${esc(p.id)}">${I.link}Copy link to post</button></div>`;
}
function saveText(p){
  const body = `${p.user.name} (@${p.user.screen_name})\n${p.created_at}\n\n${p.text}\n\n${p.url}\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], {type:'text/plain;charset=utf-8'}));
  a.download = `${p.user.screen_name}_${p.id}.txt`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const closeMenus = () => $$('.menu').forEach(m => m.remove());

/* ---------- rendering ---------- */
function avatar(u, cls){
  return u.avatar ? `<img src="${esc(u.avatar)}" referrerpolicy="no-referrer" alt="" loading="lazy">` : `<div>${initial(u.name)}</div>`;
}
function mediaHtml(p){
  if (!p.media.length) return '';
  const items = p.media.slice(0, 4).map(m => {
    let el;
    if (m.type === 'video' && m.src) el = `<video controls playsinline preload="none" poster="${esc(m.thumb)}" src="${esc(m.src)}"></video>`;
    else if (m.type === 'video') el = `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" referrerpolicy="no-referrer" alt="Video thumbnail" src="${esc(m.thumb)}"><div class="play"><span>${I.play}</span></div></a>`;
    else el = `<a href="${esc(m.src)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" referrerpolicy="no-referrer" alt="Photo by @${esc(p.user.screen_name)}" src="${esc(m.thumb)}"></a>`;
    return `<div class="m">${el}</div>`;
  }).join('');
  return `<div class="media n${Math.min(p.media.length, 4)}">${items}</div>`;
}
function postHtml(p, i){
  store[p.id] = p;
  const u = p.user;
  return `${p.retweeted_by ? `<div class="rtl">${I.repost}Reposted by @${esc(p.retweeted_by)}</div>` : ''}
  <article class="tw" style="animation-delay:${Math.min(i, 8) * 40}ms">
    <a class="av" href="#/u/${esc(u.screen_name)}" tabindex="-1" aria-hidden="true">${avatar(u)}</a>
    <div class="tb">
      <div class="th">
        <a class="nm" href="#/u/${esc(u.screen_name)}"><span style="overflow:hidden;text-overflow:ellipsis">${esc(u.name)}</span>${u.verified ? I.tick : ''}</a>
        <span class="hd">@${esc(u.screen_name)}</span><span class="hd">·</span>
        <time title="${esc(p.created_at)}">${ago(p.created_at)}</time>
      </div>
      ${p.text ? `<div class="body">${linkify(p.text)}</div>` : ''}
      ${mediaHtml(p)}
      <div class="acts">
        <span class="act cm" title="Replies"><i>${I.reply}</i>${fmt(p.replies)}</span>
        <span class="act rp" title="Reposts"><i>${I.repost}</i>${fmt(p.reposts)}</span>
        <span class="act lk" title="Likes"><i>${I.heart}</i>${fmt(p.likes)}</span>
        <span class="dlw"><button class="act dl" data-dlbtn="${esc(p.id)}" aria-haspopup="menu" aria-label="Download options"><i>${I.dl}</i></button></span>
        ${p.url ? `<a class="act ex" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open on X"><i>${I.ext}</i></a>` : '<span></span>'}
      </div>
    </div>
  </article>`;
}
const feed = list => list.length ? list.map(postHtml).join('') : '<div class="empty"><h2>Nothing here yet</h2>No public posts to show.</div>';

function profileHtml(pr){
  const stat = (n, l) => n != null ? `<span><b>${fmtFull(n)}</b> ${l}</span>` : '';
  return `<section>
    <div class="ban"></div>
    <div class="pmain">
      <div class="prow">
        <div class="pav">${pr.avatar ? `<img src="${esc(pr.avatar)}" referrerpolicy="no-referrer" alt="${esc(pr.name)}">` : `<div>${initial(pr.name)}</div>`}</div>
        <a class="pill" href="https://x.com/${esc(pr.screen_name)}" target="_blank" rel="noopener noreferrer">View on X</a>
      </div>
      <div class="pn">${esc(pr.name)}${pr.verified ? I.tick : ''}</div>
      <div class="ph">@${esc(pr.screen_name)}</div>
      ${pr.bio ? `<div class="bio">${linkify(pr.bio)}</div>` : ''}
      <div class="pst">${stat(pr.following, 'Following')}${stat(pr.followers, 'Followers')}${stat(pr.posts, 'Posts')}</div>
    </div>
    <div class="tabs" role="tablist" id="ptabs" style="border-bottom:1px solid var(--line)">
      <button class="tab" role="tab" aria-selected="true" data-pt="all">Posts</button>
      <button class="tab" role="tab" aria-selected="false" data-pt="media">Media</button>
    </div>
  </section><div id="feed"></div>`;
}
const skeleton = () => out.innerHTML = Array(5).fill('<div class="sk"><i></i><div><u></u><u></u><u></u></div></div>').join('');
const home = () => out.innerHTML = `<div class="hero"><h1>See what's happening</h1>
  <p>Search any public username or hashtag, then save the videos and photos you find.</p>
  <div class="chips"><button class="chip" data-go="#/u/NASA">@NASA</button><button class="chip" data-go="#/tag/photography">#photography</button></div></div>`;
const fail = (m, openUrl, retry = true) => out.innerHTML = `<div class="err" role="alert"><b>Couldn't load this</b><p>${esc(m)}</p><div class="row2">${retry ? '<button class="btn" id="retry">Try again</button>' : ''}${openUrl ? `<a class="btn ${retry ? 'alt' : ''}" href="${esc(openUrl)}" target="_blank" rel="noopener noreferrer">Open on X</a>` : ''}</div></div>`;

async function getJSON(url){
  let r;
  try { r = await fetch(url); } catch { throw new Error('You appear to be offline. Check your connection.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'Request failed.'); e.status = r.status; throw e; }
  return data;
}

/* ---------- routing ---------- */
let token = 0, cur = [];
function setMode(m){
  mode = m;
  $$('#modes .tab').forEach(t => t.setAttribute('aria-selected', t.dataset.mode === m));
  q.placeholder = m === 'hashtag' ? 'Search a hashtag' : 'Search a username';
}
async function route(){
  const my = ++token;
  closeMenus();
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  let m;
  $$('[data-nav=home]').forEach(b => b.classList.toggle('on', h === '/'));
  if (h === '/') { document.title = 'XViewer'; home(); return; }
  skeleton();
  try {
    if ((m = h.match(/^\/u\/(\w+)/))) {
      setMode('profile'); q.value = m[1]; clr.hidden = false;
      const d = await getJSON('/api/profile?u=' + encodeURIComponent(m[1]));
      if (my !== token) return;
      cur = d.posts;
      document.title = `${d.profile.name} (@${d.profile.screen_name}) · XViewer`;
      out.innerHTML = profileHtml(d.profile);
      $('#feed').innerHTML = feed(cur);
    } else if ((m = h.match(/^\/tag\/([\p{L}\p{N}_]+)/u))) {
      setMode('hashtag'); q.value = '#' + m[1]; clr.hidden = false;
      const d = await getJSON('/api/hashtag?q=' + encodeURIComponent(m[1]));
      if (my !== token) return;
      document.title = `#${m[1]} · XViewer`;
      out.innerHTML = `<div style="padding:16px;border-bottom:1px solid var(--line)"><div style="font-size:20px;font-weight:800">#${esc(m[1])}</div><div class="ph">${d.posts.length} recent posts</div></div>${feed(d.posts)}`;
    } else if ((m = h.match(/^\/post\/(.+)/))) {
      const d = await getJSON('/api/tweet?url=' + encodeURIComponent(m[1]));
      if (my !== token) return;
      document.title = 'Post · XViewer';
      out.innerHTML = feed(d.posts);
    } else home();
  } catch (e) {
    if (my !== token) return;
    const mm = h.match(/^\/(u|tag)\/([^/]+)/);
    const openUrl = mm ? (mm[1] === 'u' ? `https://x.com/${mm[2]}` : `https://x.com/hashtag/${mm[2]}`) : '';
    fail(e.message, openUrl, e.status !== 501);
  }
  window.scrollTo({top: 0});
}

/* ---------- events ---------- */
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = q.value.trim(); if (!v) return q.focus();
  let target;
  if (/^https?:\/\/(www\.|mobile\.)?(x|twitter)\.com\/\w+\/status\/\d+/i.test(v)) target = '#/post/' + encodeURIComponent(v);
  else if (mode === 'hashtag' || v.startsWith('#')) target = '#/tag/' + encodeURIComponent(v.replace(/^#/, ''));
  else target = '#/u/' + encodeURIComponent(v.replace(/^@/, '').replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, '').split(/[/?]/)[0]);
  if (location.hash === target) route(); else location.hash = target;
  q.blur();
});
q.addEventListener('input', () => clr.hidden = !q.value);
clr.addEventListener('click', () => { q.value = ''; clr.hidden = true; q.focus(); });
$('#modes').addEventListener('click', e => { const t = e.target.closest('[data-mode]'); if (t) { setMode(t.dataset.mode); q.focus(); } });

document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  if (t.closest('#retry')) return route();
  const pt = t.closest('[data-pt]');
  if (pt) {
    $$('#ptabs .tab').forEach(x => x.setAttribute('aria-selected', x === pt));
    $('#feed').innerHTML = feed(pt.dataset.pt === 'media' ? cur.filter(p => p.media.length) : cur);
    return;
  }
  const nav = t.closest('[data-nav]');
  if (nav) {
    const k = nav.dataset.nav;
    if (k === 'search') { window.scrollTo({top: 0, behavior: 'smooth'}); q.focus(); }
    else if (k === 'theme') toggleTheme();
    else if (location.hash === '#/' || !location.hash) { q.value = ''; clr.hidden = true; window.scrollTo({top: 0}); }
    return;
  }
  const btn = t.closest('[data-dlbtn]');
  if (btn) {
    const wrap = btn.parentElement, had = wrap.querySelector('.menu');
    closeMenus();
    if (!had) wrap.insertAdjacentHTML('beforeend', menuHtml(store[btn.dataset.dlbtn]));
    return;
  }
  const st = t.closest('[data-savetext]');
  if (st) { saveText(store[st.dataset.savetext]); closeMenus(); toast('Saved post as text'); return; }
  const cp = t.closest('[data-copy]');
  if (cp) {
    navigator.clipboard?.writeText(store[cp.dataset.copy].url).then(() => toast('Link copied'), () => toast('Couldn\'t copy the link'));
    closeMenus(); return;
  }
  if (t.closest('[data-dl]')) { toast('Starting download…'); closeMenus(); return; }
  closeMenus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('#tc').content = t === 'dark' ? '#000000' : '#ffffff';
}
function toggleTheme(){
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('xv-theme', t); } catch {}
}
(function initTheme(){
  let t = null;
  try { t = localStorage.getItem('xv-theme'); } catch {}
  applyTheme(t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
})();

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
